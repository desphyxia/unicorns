<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Elsa's Castle</title>
  <meta name="theme-color" content="#bfe3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Elsa's Castle"></svg>

  <div id="start">
    <h1 aria-label="Elsa's Castle"></h1>
    <button id="play" aria-label="Play"><svg viewBox="0 0 100 100"><polygon points="34,20 34,80 82,50" fill="#fff"/></svg></button>
  </div>

  <button id="lakeHome" aria-label="Back to the castle" hidden>
    <svg viewBox="0 0 100 100"><rect x="30" y="42" width="40" height="42" rx="3" fill="#f0e2ff" stroke="#fff" stroke-width="3"/><rect x="14" y="36" width="20" height="48" rx="3" fill="#f6e8ff" stroke="#fff" stroke-width="3"/><rect x="66" y="36" width="20" height="48" rx="3" fill="#f6e8ff" stroke="#fff" stroke-width="3"/><polygon points="10,38 38,38 24,12" fill="#ff8fc7"/><polygon points="62,38 90,38 76,12" fill="#5cc8ff"/><polygon points="34,44 66,44 50,18" fill="#ffd23f"/><path d="M42,84 v-16 a8,8 0 0 1 16,0 v16Z" fill="#d3bdff"/></svg>
  </button>

  <svg id="trip" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" style="display:none"></svg>
  <div id="picker" hidden></div>
  <div id="wardrobe" hidden></div>
  <div id="fade"></div>

  <button id="parent" aria-label="Parent corner (hold for 3 seconds)">
    <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="track"/><circle id="ring" cx="22" cy="22" r="18" class="ring"/></svg>
  </button>

  <div id="dock">
    <button id="camBtn" aria-label="Take a photo"><svg viewBox="0 0 120 100"><rect x="8" y="26" width="104" height="66" rx="16" fill="#fff"/><rect x="38" y="12" width="44" height="20" rx="8" fill="#fff"/><circle cx="60" cy="60" r="26" fill="#a98bff"/><circle cx="60" cy="60" r="15" fill="#ffd1e8"/><circle cx="52" cy="52" r="5" fill="#fff" opacity=".8"/><circle cx="98" cy="40" r="5" fill="#ff6b8b"/></svg></button>
    <button id="albumBtn" aria-label="Photo book"><svg viewBox="0 0 120 100"><rect x="14" y="10" width="92" height="80" rx="12" fill="#ff8fc7"/><rect x="26" y="20" width="68" height="60" rx="6" fill="#fff"/><circle cx="46" cy="40" r="8" fill="#ffd84d"/><path d="M26,80 L50,54 L66,70 L78,58 L94,80Z" fill="#6edc8c"/></svg></button>
    <button id="partyBtn" aria-label="Party"><svg viewBox="0 0 120 100"><rect x="22" y="52" width="76" height="38" rx="10" fill="#ffc2e2"/><rect x="34" y="34" width="52" height="24" rx="8" fill="#fff"/><path d="M22,56 q9,12 18,0 t18,0 t18,0 t18,0" stroke="#fff" stroke-width="7" fill="none"/><rect x="45" y="16" width="6" height="20" rx="3" fill="#5cc8ff"/><rect x="57" y="16" width="6" height="20" rx="3" fill="#ffd23f"/><rect x="69" y="16" width="6" height="20" rx="3" fill="#6edc8c"/><ellipse cx="48" cy="11" rx="4" ry="6" fill="#ffb02e"/><ellipse cx="60" cy="11" rx="4" ry="6" fill="#ffb02e"/><ellipse cx="72" cy="11" rx="4" ry="6" fill="#ffb02e"/></svg></button>
  </div>
  <div id="album" hidden></div>
  <div id="flash"></div>
  <div id="banner" hidden></div>

  <div id="panel" hidden>
    <div class="card">
      <h2>Parent corner</h2>
      <label><input type="checkbox" id="snd" checked> Sound</label>
      <div id="names"></div>
      <button id="clearPhotos">Delete all photos</button>
      <button id="reset">Reset the castle</button>
      <button id="close">Close</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
